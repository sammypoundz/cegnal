<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141005"/>
      <stop offset="0.55" stop-color="#3a2c0a"/>
      <stop offset="1" stop-color="#c99a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.25" r="0.7">
      <stop offset="0" stop-color="#ffd66b" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffd66b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="1" stop-color="#d9a92e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#bg)"/>
  <rect width="800" height="480" fill="url(#glow)"/>

  <g stroke="#ffffff" stroke-opacity="0.06">
    <path d="M0 96h800M0 192h800M0 288h800M0 384h800"/>
    <path d="M114 0v480M228 0v480M342 0v480M456 0v480M570 0v480M684 0v480"/>
  </g>

  <!-- gold bars -->
  <g stroke="#a87c16" stroke-width="3">
    <path d="M120 330 150 280h120l30 50Z" fill="url(#gold)"/>
    <path d="M290 330 320 280h120l30 50Z" fill="url(#gold)"/>
    <path d="M205 260 235 210h120l30 50Z" fill="url(#gold)" transform="translate(0 -6)"/>
    <path d="M205 402 235 352h120l30 50Z" fill="url(#gold)" opacity="0.9"/>
  </g>

  <!-- rising gold price line -->
  <path d="M0 430 110 400 220 415 330 350 440 370 550 290 660 310 800 220"
    fill="none" stroke="#ffe9a8" stroke-opacity="0.8" stroke-width="5" stroke-linecap="round"/>
  <circle cx="550" cy="290" r="9" fill="#ffe9a8"/>
  <circle cx="550" cy="290" r="18" fill="none" stroke="#ffe9a8" stroke-opacity="0.45" stroke-width="2"/>

  <!-- XAU/USD tag -->
  <rect x="600" y="60" width="150" height="42" rx="10" fill="#101820" opacity="0.75"/>
  <text x="675" y="88" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800" fill="#ffd66b" text-anchor="middle">XAU/USD</text>
</svg>
