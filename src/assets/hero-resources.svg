<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#132a3f"/>
      <stop offset="1" stop-color="#0e8f6f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#4dffa0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4dffa0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4dffa0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4dffa0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#bg)"/>
  <rect width="800" height="480" fill="url(#glow)"/>

  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.06">
