<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12061a"/>
      <stop offset="0.55" stop-color="#34145c"/>
      <stop offset="1" stop-color="#7a3cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#c9a2ff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#c9a2ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="480" fill="url(#bg)"/>
  <rect width="800" height="480" fill="url(#glow)"/>

  <!-- globe -->
  <g stroke="#ffffff" stroke-opacity="0.5" fill="none" stroke-width="2.5">
    <circle cx="600" cy="240" r="130"/>
    <ellipse cx="600" cy="240" rx="130" ry="48"/>
    <ellipse cx="600" cy="240" rx="48" ry="130"/>
    <line x1="470" y1="240" x2="730" y2="240"/>
  </g>
  <circle cx="600" cy="240" r="130" fill="#7a3cff" opacity="0.25"/>

  <!-- location pins = signal zones -->
  <g>
    <g transform="translate(560 180)">
      <path d="M0 0C-14 -22 -14 -38 0 -38 14 -38 14 -22 0 0Z" fill="#4dffa0" transform="rotate(180)"/>
      <circle cy="-26" r="7" fill="#12061a"/>
    </g>
    <g transform="translate(660 280)">
      <path d="M0 0C-14 -22 -14 -38 0 -38 14 -38 14 -22 0 0Z" fill="#ffd66b" transform="rotate(180)"/>
      <circle cy="-26" r="7" fill="#12061a"/>
    </g>
    <g transform="translate(540 320)">
      <path d="M0 0C-12 -19 -12 -33 0 -33 12 -33 12 -19 0 0Z" fill="#ff8fa3" transform="rotate(180)"/>
      <circle cy="-23" r="6" fill="#12061a"/>
    </g>
  </g>

  <!-- mini candles panel -->
  <g transform="translate(80 90)">
    <rect width="240" height="290" rx="18" fill="#0b1220" opacity="0.7"/>
    <g stroke-width="3">
      <line x1="40" y1="60" x2="40" y2="130" stroke="#ff8fa3"/>
      <rect x="30" y="78" width="20" height="40" rx="3" fill="#ff8fa3"/>
      <line x1="80" y1="40" x2="80" y2="110" stroke="#4dffa0"/>
      <rect x="70" y="56" width="20" height="42" rx="3" fill="#4dffa0"/>
      <line x1="120" y1="70" x2="120" y2="140" stroke="#4dffa0"/>
      <rect x="110" y="88" width="20" height="40" rx="3" fill="#4dffa0"/>
      <line x1="160" y1="30" x2="160" y2="100" stroke="#ff8fa3"/>
      <rect x="150" y="48" width="20" height="38" rx="3" fill="#ff8fa3"/>
      <line x1="200" y1="16" x2="200" y2="86" stroke="#4dffa0"/>
      <rect x="190" y="34" width="20" height="40" rx="3" fill="#4dffa0"/>
    </g>
    <path d="M20 230 60 200 100 215 140 170 180 185 220 140" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- currency labels -->
  <g font-family="Inter, Segoe UI, sans-serif" font-weight="800" font-size="24" text-anchor="middle">
    <rect x="470" y="404" width="86" height="38" rx="9" fill="#101820" opacity="0.7"/>
    <text x="513" y="430" fill="#4dffa0">EUR</text>
    <rect x="572" y="404" width="86" height="38" rx="9" fill="#101820" opacity="0.7"/>
    <text x="615" y="430" fill="#ffd66b">GOLD</text>
    <rect x="674" y="404" width="86" height="38" rx="9" fill="#101820" opacity="0.7"/>
    <text x="717" y="430" fill="#ff8fa3">BTC</text>
  </g>
</svg>
