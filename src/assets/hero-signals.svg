<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101820"/>
      <stop offset="0.6" stop-color="#1a2536"/>
      <stop offset="1" stop-color="#c99a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#ffd66b" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffd66b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="480" fill="url(#bg)"/>
  <rect width="800" height="480" fill="url(#glow)"/>

  <g stroke="#ffffff" stroke-opacity="0.06">
    <path d="M0 96h800M0 192h800M0 288h800M0 384h800"/>
    <path d="M114 0v480M228 0v480M342 0v480M456 0v480M570 0v480M684 0v480"/>
  </g>

  <!-- price chart -->
  <path d="M0 360 90 320 180 340 270 280 360 300 450 230 540 250 630 180 720 200 800 140"
    fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="5" stroke-linecap="round"/>

  <!-- entry band -->
  <rect x="60" y="210" width="560" height="44" rx="8" fill="#ffd66b" opacity="0.25"/>
  <line x1="60" y1="232" x2="620" y2="232" stroke="#ffd66b" stroke-width="3" stroke-dasharray="10 7"/>
  <rect x="540" y="216" width="120" height="32" rx="6" fill="#ffd66b"/>
  <text x="600" y="238" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#101820" text-anchor="middle">ENTRY</text>

  <!-- stop -->
  <line x1="60" y1="330" x2="620" y2="330" stroke="#ff8fa3" stroke-width="3" stroke-dasharray="10 7"/>
  <rect x="540" y="314" width="120" height="32" rx="6" fill="#ff8fa3"/>
  <text x="600" y="336" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#101820" text-anchor="middle">STOP</text>

  <!-- target -->
  <line x1="60" y1="140" x2="620" y2="140" stroke="#4dffa0" stroke-width="3" stroke-dasharray="10 7"/>
  <rect x="540" y="124" width="120" height="32" rx="6" fill="#4dffa0"/>
  <text x="600" y="146" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#101820" text-anchor="middle">TARGET</text>

  <!-- coins -->
  <g transform="translate(690 380)">
    <circle r="46" fill="none" stroke="#ffd66b" stroke-width="4" stroke-opacity="0.7"/>
    <circle r="34" fill="#ffd66b" opacity="0.15"/>
    <path d="M-14 6 0 -14 14 6" fill="none" stroke="#ffd66b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
